name: Raqeem KMP CI/CD

on:
  push:
    branches: [ master, feature/*, spec/* ]
  pull_request:
    branches: [ master ]

jobs:
  build-and-test:
    name: Build & Verify KMP Shared & Apps
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Download Whisper Model for Build
        run: |
          mkdir -p androidApp/src/main/assets/models
          curl -L -o androidApp/src/main/assets/models/ggml-tiny-q5_1.bin https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny-q5_1.bin

      - name: Run KMP Unit Tests (TDD Verification)
        run: ./gradlew :shared:jvmTest --no-daemon

      - name: Build Desktop Artifact
        run: ./gradlew :desktopApp:assemble --no-daemon

      - name: Build Android Debug APK
        run: ./gradlew :androidApp:assembleDebug --no-daemon

