name: Raqeem KMP CI/CD

on:
  push:
    branches: [ master, feature/*, spec/* ]
  pull_request:
    branches: [ master ]

jobs:
  build-and-test:
    name: Build & Verify KMP Shared & Apps
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run KMP Unit Tests (TDD Verification)
        run: ./gradlew :shared:jvmTest --no-daemon

      - name: Build Desktop Artifact
        run: ./gradlew :desktopApp:assemble --no-daemon

      - name: Build Android Debug APK
        run: ./gradlew :androidApp:assembleDebug --no-daemon
